<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BandApp Pro - Live Sync</title>
  
  <link rel="icon" href="/icon-512.png">

<link rel="apple-touch-icon" href="/icon-512.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black">

<meta name="apple-mobile-web-app-title" content="BandApp">

<link rel="manifest" href="/manifest.json">

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <style>
    :root{
      --bg:#000;
      --text:#eee;
      --accent:#ff9800;
      --chord-color:#ff9800;
      --chord-size:.86em;
      --edit:#2196F3;
      --lyric-weight:450;
      --lyric-stroke:0.18px;
      --lyric-shadow:0.012em 0 0 currentColor;
      --lyric-chord-weight:450;
      --lyric-chord-stroke:0.18px;

      --pu-bg: rgba(168, 85, 247, 0.16);
      --pu-border: rgba(168, 85, 247, 0.55);
      --pu-text: var(--text);

      --nav-bg:#1a1a1a;
      --nav-text:#eee;
      --panel-bg:#111;
      --panel-border:#333;

      --chorus-bg:#111827;
      --chorus-border:#60a5fa;
      --chorus-text: var(--text);
      --verse-bg:rgba(120,120,120,0.12);
      --verse-border:#8a8a8a;
      --verse-text: var(--text);
      --bridge-bg:rgba(168,85,247,0.13);
      --bridge-border:#a855f7;
      --bridge-text: var(--text);

      --comment-bg:#ffd54f;
      --comment-text:#000;
      --detail-comment-bg:#4b5563;
      --detail-comment-text:#fff;
    }
	
	.meta-form{
  color: var(--text);
}

.meta-form label{
  display:grid;
  gap:6px;
  color: var(--text);
}

.meta-form .meta-label{
  color: #eee;
  font-weight: 700;
}

.meta-form input,
.meta-form select,
.meta-form textarea{
  width:100%;
  padding:10px;
  box-sizing:border-box;
  background:#0b0b0b;
  color:#eee;
  border:1px solid #444;
  border-radius:8px;
}

#prevSongBtn{
  left:12px;
  top:104px;
}

#nextSongBtn{
  right:12px;
  top:104px;
}

#bottomSpeedBar{
  display:none;
  position:fixed;
  left:12px;
  right:12px;
  bottom:12px;
  z-index:35;
  background:rgba(0,0,0,0.78);
  backdrop-filter: blur(6px);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:14px;
  padding:10px 12px 12px;
}

#bottomSpeedBar input[type="range"]{
  width:100%;
  margin:0;
  height:50px;
  accent-color: #ff9800;
}

#bottomSpeedBar input[type="range"]::-webkit-slider-thumb{
  width:36px;
  height:36px;
}

#bottomSpeedBar input[type="range"]::-webkit-slider-runnable-track{
  height:16px;
  border-radius:999px;
}

#bottomSpeedBar input[type="range"]::-moz-range-thumb{
  width:36px;
  height:36px;
  border:none;
}

#bottomSpeedBar input[type="range"]::-moz-range-track{
  height:16px;
  border-radius:999px;
}

#speedPercent{
  text-align:center;
  font-weight:900;
  font-size:13px;
  color:#fff;
  margin-bottom:8px;
}

body.concert-mode #bottomSpeedBar{
  bottom:12px;
}

body.concert-mode #prevSongBtn,
body.concert-mode #nextSongBtn{
  display:block;
}
	
	#leaderFloatingActions{
  display:none;
  position:fixed;
  top:72px;
  left:0;
  right:0;
  z-index:30;
  pointer-events:none;
}

.center-btn{
  left:50%;
  transform:translateX(-50%);
}

#concertFloatingActions{
  position:fixed;
  top:72px;
  left:0;
  right:0;
  z-index:29;
  pointer-events:none;
}

#concertFloatingActions .concert-float-btn{
  position:absolute;
  pointer-events:auto;
  background:rgba(0,0,0,0.72);
  backdrop-filter: blur(6px);
}

.center-btn{
  left:50%;
  transform:translateX(-50%);
}

body.concert-mode nav{
  display:none !important;
}

body.concert-mode #viewer{
  height:100vh;
  padding-top:20px;
}

body.concert-mode #notesPanel{
  display:none !important;
}

body.concert-mode #leaderFloatingActions{
  top:12px;
}

body.concert-mode #concertFloatingActions{
  top:12px;
}

body.concert-mode #settingsFixedWrap{
  display:none !important;
}
#concertModeBtn.active-btn{
  background:rgba(255,152,0,0.25);
  color:#fff;
}

#leaderFloatingActions .leader-float-btn{
  position:absolute;
  pointer-events:auto;
  background:rgba(0,0,0,0.72);
  backdrop-filter: blur(6px);
}

#leaderPlayBtn{
  left:12px;
  top:0;
}

#playedToggleBtn{
  left:12px;
  top:52px;
}

#randomSongBtn{
  right:12px;
  top:0;
}

    body{
      font-family:sans-serif;
      background:var(--bg);
      color:var(--text);
      margin:0;
      overflow:hidden;
      overscroll-behavior-x:none;
    }

    .version-badge{
      font-weight:900;
      font-size:12px;
      padding:8px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.18);
      background:rgba(255,255,255,0.08);
      color:var(--text);
      white-space:nowrap;
    }

    #leaderBadge{
      cursor:pointer;
      user-select:none;
    }

    .version-badge.perso{
      border-color: rgba(59,130,246,0.55);
      background: rgba(59,130,246,0.18);
    }

    .version-badge.off{
      border-color: rgba(255,152,0,0.55);
      background: rgba(255,152,0,0.18);
    }

    #netBadge.off{
      border-color: rgba(244,67,54,0.55);
      background: rgba(244,67,54,0.18);
    }

    #netBadge.on{
      border-color: rgba(76,175,80,0.55);
      background: rgba(76,175,80,0.18);
    }

#settingsFixedWrap{
  position:fixed;
  top:10px;
  right:10px;
  z-index:6000;
  display:flex;
  align-items:center;
  gap:8px;
}

    #settingsBtnFixed{
      border:2px solid var(--accent);
      border-radius:10px;
      background:rgba(0,0,0,0.25);
      color:var(--accent);
      font-weight:900;
      padding:10px 12px;
      cursor:pointer;
      backdrop-filter: blur(6px);
    }

    #toast{
      position:fixed;
      left:50%;
      top:18px;
      transform:translateX(-50%);
      z-index:7000;
      background:rgba(0,0,0,0.85);
      color:#fff;
      padding:10px 14px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.15);
      display:none;
      font-size:14px;
      font-weight:700;
      max-width:min(92vw, 520px);
      text-align:center;
    }

    #userOverlay{
      position:fixed;
      inset:0;
      z-index:5000;
      display:none;
      background:rgba(0,0,0,0.92);
      align-items:center;
      justify-content:center;
      padding:18px;
    }

    #userModal{
      width:min(560px,100%);
      background:#111;
      border:1px solid #2a2a2a;
      border-radius:14px;
      overflow:hidden;
    }

    #userModal header{
      padding:14px 16px;
      border-bottom:1px solid #2a2a2a;
      background:#161616;
    }

    #userModal header h3{
      margin:0;
      font-size:14px;
      color:#fff;
    }

    #userModal .content{ padding:14px 16px; }

    #userModal .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .user-choice{
      border:1px solid #333;
      background:#0b0b0b;
      border-radius:12px;
      padding:12px;
      cursor:pointer;
      text-align:center;
      font-weight:bold;
      color:#fff;
      user-select:none;
    }

    .user-choice:hover{ background:#101010; }

    #userModal .actions{
      padding:14px 16px;
      border-top:1px solid #2a2a2a;
      display:flex;
      justify-content:flex-start;
      gap:10px;
      flex-wrap:wrap;
    }

    #library{
      height:100vh;
      overflow-y:auto;
      display:block;
      -webkit-overflow-scrolling:touch;
    }

    .lib-header{
      padding:20px;
      padding-right:420px;
      background:var(--nav-bg);
      border-bottom:2px solid var(--accent);
      display:flex;
      justify-content:space-between;
      align-items:center;
      position:sticky;
      top:0;
      z-index:5;
      color:var(--nav-text);
      gap:12px;
    }

    .category-title-wrap{
      position:relative;
      display:inline-flex;
      align-items:center;
      flex:0 0 auto;
    }

    #categoryTitle{
      margin:0;
      white-space:nowrap;
      color:var(--nav-text);
      font-size:1.5em;
      font-weight:700;
      pointer-events:none;
    }

    #categoryFilter{
      position:absolute;
      inset:0;
      opacity:0;
      cursor:pointer;
    }

    .song-item{
      padding:20px;
      border-bottom:1px solid #222;
      display:flex;
      justify-content:space-between;
      font-size:1.1em;
      cursor:pointer;
    }

    #viewer-container{
      display:none;
      position:fixed;
      top:0;
      left:0;
      width:100vw;
      height:100vh;
      background:var(--bg);
      z-index:10;
    }
	
	.song-item.played{
  opacity:0.6;
}

.song-left{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.song-title{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.song-badge{
  font-size:11px;
  font-weight:900;
  padding:4px 8px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.08);
  color:var(--text);
  white-space:nowrap;
}

.song-badge.played{
  border-color: rgba(76,175,80,0.55);
  background: rgba(76,175,80,0.18);
}

nav{
  display:flex;
  background:var(--nav-bg);
  color:var(--nav-text);
  min-height:60px;
  align-items:center;
  padding:6px 10px;
  gap:8px;
  border-bottom:1px solid var(--panel-border);
  flex-wrap:wrap;
}

#viewer-container nav .btn,
#viewer-container nav input[type="range"]{
  flex-shrink:0;
}

    .controls-group{
      display:flex;
      align-items:center;
      gap:5px;
      background:rgba(255,255,255,0.06);
      padding:5px;
      border-radius:8px;
    }

    #updateBanner{
      position:sticky;
      top:0;
      z-index:999;
      display:none;
      background:rgba(255,255,255,0.06);
      border-bottom:1px solid var(--panel-border);
      padding:10px 12px;
      font-size:14px;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      color:var(--text);
    }

    #updateBanner .msg{ color:var(--text); }

    #updateBanner .btn-small{
      padding:8px 10px;
      border-radius:6px;
      font-size:12px;
    }

    #notesPanel{
      display:none;
      background:var(--panel-bg);
      border-bottom:1px solid var(--panel-border);
      padding:12px;
    }

    #notesTextarea{
      width:100%;
      min-height:120px;
      background:#000;
      color:#0f0;
      border:1px solid #333;
      padding:10px;
      font-family:monospace;
      resize:vertical;
      box-sizing:border-box;
    }

    #viewer{
      height:calc(100vh - 65px);
      overflow-y:scroll;
      padding:25px;
      font-family:'Courier New', Courier, monospace;
      -webkit-overflow-scrolling:touch;
      scroll-behavior:auto !important;
      touch-action:pan-y;
    }

    .block{ margin-bottom:26px; }

    .chordline,.lyricline{
      white-space:pre-wrap;
      word-break:keep-all;
      overflow-wrap:normal;
      hyphens:none;
      line-height:1.6;
      margin:0;
    }

    .chordline{ color:var(--accent); font-weight:bold; }
    .lyricline{
      font-weight:var(--lyric-weight);
      -webkit-text-stroke:var(--lyric-stroke) currentColor;
      text-shadow:var(--lyric-shadow);
    }

    .chord-row{
      display:flex;
      flex-wrap:wrap;
      align-items:flex-end;
      row-gap:.2em;
      column-gap:0;
      line-height:1.25;
      white-space:normal;
      overflow-wrap:normal;
      font-weight:var(--lyric-weight);
    }

    .chord-row.no-chords{
      line-height:1.6;
    }

    .chord-cell{
      display:inline-flex;
      flex-direction:column;
      align-items:flex-start;
      width:max-content;
      min-width:max-content;
      max-width:none;
      vertical-align:bottom;
      flex:0 0 max-content;
      white-space:nowrap;
      word-break:normal !important;
      overflow-wrap:normal !important;
      break-inside:avoid;
      page-break-inside:avoid;
      -webkit-column-break-inside:avoid;
      font-weight:var(--lyric-weight);
    }

    .chord-cell .chord{
      min-height:1.15em;
      color:var(--chord-color);
      font-weight:bold;
      font-size:var(--chord-size);
      line-height:1.05;
      white-space:nowrap;
    }

    .chord-row.no-chords .chord{
      display:none;
    }

    .chord-cell .lyric{
      display:block;
      white-space:nowrap;
      word-break:normal !important;
      overflow-wrap:normal !important;
      hyphens:none;
      line-height:1.25;
      font-weight:var(--lyric-weight);
      -webkit-text-stroke:var(--lyric-stroke) currentColor;
      text-shadow:var(--lyric-shadow);
      -webkit-line-break:normal;
      width:max-content;
      min-width:max-content;
      max-width:none;
    }

    .chord-row.no-chords .lyric{
      line-height:1.6;
    }

    .commentwrap{ margin:12px 0; }

    .commentline{
      display:inline-block;
      background:var(--comment-bg);
      color:var(--comment-text);
      padding:6px 10px;
      border-radius:8px;
      font-family:sans-serif;
      font-weight:900;
      font-size:18px;
      line-height:1.2;
    }

    .commentline.detail{
      background:var(--detail-comment-bg);
      color:var(--detail-comment-text);
    }

    .chorus-block,
    .verse-block,
    .bridge-block{
      padding:12px 12px;
      border-radius:12px;
      margin:14px 0;
    }

    .chorus-block{
      background:var(--chorus-bg);
      border-left:4px solid var(--chorus-border);
      color:var(--chorus-text);
    }

    .verse-block{
      background:var(--verse-bg);
      border-left:4px solid var(--verse-border);
      color:var(--verse-text);
    }

    .bridge-block{
      background:var(--bridge-bg);
      border-left:4px solid var(--bridge-border);
      color:var(--bridge-text);
    }

    .pu-block{
      margin:14px 0;
      border-left:4px solid var(--pu-border);
      padding:10px 12px;
      border-radius:12px;
      background: var(--pu-bg);
      color: var(--pu-text);
    }

    .pu-label{
      font-family:sans-serif;
      font-weight:900;
      font-size:12px;
      opacity:.65;
      margin-bottom:8px;
    }

    .pu-pre{
      margin:0;
      white-space:pre;
      overflow-x:auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
      font-size: calc(14px * var(--song-zoom, 1));
      line-height: calc(17.5px * var(--song-zoom, 1));
    }

    .tab-block{
      margin:16px 0 22px;
      padding:10px 12px;
      border-left:4px solid var(--accent);
      border-radius:10px;
      background:rgba(255,152,0,0.08);
      color:var(--text);
      max-width:100%;
      width:100%;
      box-sizing:border-box;
      overflow:hidden;
    }

    .tab-pre{
      margin:0;
      white-space:pre;
      overflow:hidden;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
      font-size:var(--tab-font-size, 13px);
      line-height:1.25;
      letter-spacing:0;
      font-weight:500;
      transform-origin:left top;
    }

    .song-end-spacer{
      height:33vh;
    }

    #editor-container{
      display:none;
      position:fixed;
      top:60px;
      left:0;
      right:0;
      bottom:0;
      background:#111;
      z-index:20;
      flex-direction:column;
    }

    #editor-warning{
      flex:0 0 auto;
      background:rgba(255, 87, 34, 0.14);
      border-bottom:1px solid rgba(255, 87, 34, 0.4);
      color:#ffd7c7;
      padding:12px 14px;
      font-size:13px;
      font-weight:800;
      line-height:1.35;
      text-transform:uppercase;
    }

    #editor-toolbar{
      flex:0 0 auto;
      padding:10px;
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      border-bottom:1px solid #2a2a2a;
      background:rgba(255,255,255,0.03);
    }

    #editor-textarea{
      flex:1 1 auto;
      min-height:0;
      width:100%;
      background:#000;
      color:#2196F3;
      border:none;
      font-family:monospace;
      font-size:16px;
      padding:20px;
      box-sizing:border-box;
      resize:none;
    }

    .editor-footer{
      position:sticky;
      bottom:0;
      z-index:2;
      flex:0 0 auto;
      min-height:74px;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:20px;
      background:var(--nav-bg);
      padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 8px);
      border-top:1px solid rgba(255,255,255,0.08);
    }

    .btn{
      cursor:pointer;
      padding:10px 14px;
      border:2px solid var(--accent);
      border-radius:6px;
      color:var(--accent);
      background:none;
      font-size:13px;
      font-weight:bold;
    }

    .btn-blue{ border-color:var(--edit); color:var(--edit); }

    .active-btn{ background:#444; color:#fff; }

    .leader-only{
      display:none;
    }

    #songContent {
      position: relative;
      padding-top:22vh;
    }

    body.concert-mode #songContent{
      padding-top:20vh;
    }

    #overlayLayer{
      position:absolute;
      inset:0;
      pointer-events:none;
      z-index:3;
    }

    .gridOverlay{
      position:absolute;
      left:0;
      right:0;
      padding:0 6px;
      pointer-events:auto;
    }

    .gridOverlay .box{
      display:inline-block;
      max-width:100%;
      background: rgba(34, 197, 94, 0.18);
      border: 1px solid rgba(34, 197, 94, 0.45);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-weight: 800;
      font-size: 14px;
      line-height: 1.25;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

#connectedUsersBox{
  border:1px solid var(--panel-border);
  background:var(--panel-bg);
  border-radius:8px;
  padding:10px;
  margin-top:10px;
}

#connectedUsersTitle{
  color: var(--text);
  font-weight:600;
}

#connectedUsersList{
  white-space:pre-line;
  line-height:1.5;
  font-size:14px;
  color: var(--text);
}

  </style>
</head>

<body>
<div id="settingsFixedWrap">
  <span id="leaderBadge" class="version-badge off" onclick="toggleLeader()" title="Changer le mode leader">FOLLOW</span>
  <button id="settingsBtnFixed" onclick="openSettings()">⚙️ Utilisateur</button>
</div>

  <div id="toast"></div>

  <div id="userOverlay">
    <div id="userModal">
      <header><h3>Choisir l’utilisateur</h3></header>
      <div class="content">
        <div class="grid" id="userGrid"></div>
      </div>
      <div class="actions">
        <button class="btn" style="border-color:#777;color:#777;" onclick="addUser()">+ Ajouter</button>
      </div>
    </div>
  </div>

<div id="library">
  <div class="lib-header">
    <div class="category-title-wrap">
      <h2 id="categoryTitle">Répertoire</h2>
      <select id="categoryFilter" aria-label="Catégorie du répertoire">
        <option value="Répertoire">Répertoire</option>
      </select>
    </div>

    <input id="songSearch" type="search" placeholder="Rechercher un morceau..."
      style="flex:1; margin:0 12px; padding:10px 12px; border-radius:10px;
             border:1px solid rgba(255,255,255,0.15); background:rgba(0,0,0,0.25);
             color:var(--nav-text); outline:none; max-width:320px;" />

    <span style="opacity:.8; font-size:12px; white-space:nowrap;" id="songCount"></span>
  </div>

  <div id="libraryFilters" style="
    padding:12px 20px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    background:var(--nav-bg);
    border-bottom:1px solid var(--panel-border);
  ">
    <select id="ambianceFilter" style="
      padding:10px 12px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.15);
      background:rgba(0,0,0,0.25);
      color:var(--nav-text);

function getAutoUserColor(userName) {
  if (!userName) return "#c7b6ff";

  const colors = [
    "#c7b6ff",
    "#a8d8ff",
    "#b8f2d3",
    "#ffd6a5",
    "#ffb3c6",
    "#ffe599",
    "#b5ead7",
    "#cdb4db",
    "#ffc8dd",
    "#d0f4de"
  ];

  let hash = 0;
  for (let i = 0; i < userName.length; i++) {
    hash = userName.charCodeAt(i) + ((hash << 5) - hash);
  }

  return colors[Math.abs(hash) % colors.length];
}

function getUserColor(userName) {
  const clean = String(userName || '').trim();
  if (!clean) return "#c7b6ff";
  return userColors[clean] || getAutoUserColor(clean);
}

function hexToRgba(hex, alpha) {
  const clean = String(hex || '').replace('#', '');
  if (clean.length !== 6) return `rgba(168, 85, 247, ${alpha})`;

  const r = parseInt(clean.slice(0, 2), 16);
  const g = parseInt(clean.slice(2, 4), 16);
  const b = parseInt(clean.slice(4, 6), 16);

  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function canUseWakeLock() {
  return typeof window !== 'undefined'
    && window.isSecureContext
    && 'wakeLock' in navigator;
}

function showWakeLockFallbackNotice() {
  if (wakeLockNoticeShown) return;
  wakeLockNoticeShown = true;
  showToast("Anti-veille non disponible sur cet appareil");
}

async function requestWakeLock() {
  wakeLockSupportChecked = true;

  if (!canUseWakeLock()) return false;
  if (document.visibilityState !== 'visible') return false;
  if (wakeLockSentinel && !wakeLockSentinel.released) return true;

  try {
    wakeLockSentinel = await navigator.wakeLock.request('screen');
    wakeLockSentinel.addEventListener('release', () => {
      wakeLockSentinel = null;
      if (document.visibilityState === 'visible') {
        setTimeout(() => {
          requestWakeLock().catch(() => {});
        }, 250);
      }
    }, { once: true });
    return true;
  } catch (err) {
    console.warn('Wake lock non obtenu', err);
    showWakeLockFallbackNotice();
    return false;
  }
}

async function releaseWakeLock() {
  if (!wakeLockSentinel) return;

  try {
    await wakeLockSentinel.release();
  } catch (err) {
    console.warn('Wake lock release ignoré', err);
  } finally {
    wakeLockSentinel = null;
  }
}

function ensureWakeLockSoon() {
  requestWakeLock().catch(() => {});
}

async function deleteCurrentSong() {
  if (!currentFileName) return;

  const confirmText = prompt("Pour supprimer ce morceau, tape SUPPRIMER");
  if (!confirmText) return;

  if (String(confirmText).trim().toUpperCase() !== "SUPPRIMER") {
    alert("Confirmation invalide");
    return;

  const pin = prompt("PIN requis pour supprimer ce morceau") || "";
  const cleanPin = String(pin).trim();
  if (!cleanPin) return;

  try {
    const res = await fetch('/delete-song', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        fileName: currentFileName,
        pin: cleanPin,
        confirmText
      })
    });

    if (res.ok) {
      const deletedFileName = currentFileName;

      closeViewer();
      await fetchSongMeta();
      await fetchSongs();
      filterSongList(songSearchInput?.value || "");

      showToast(`Morceau supprimé : ${deletedFileName}`);
    } else if (res.status === 403) {
      alert("PIN invalide");
    } else {
      const txt = await res.text();
      alert("Erreur de suppression : " + txt);
    }
  } catch (err) {
    console.error(err);
    alert("Erreur de suppression");
  }
}

function getMetaValues(fieldName) {
  const values = new Set();

  Object.values(songMeta || {}).forEach(entry => {
    const v = entry?.[fieldName];

    if (Array.isArray(v)) {
      v.forEach(x => {
        const clean = String(x || '').trim();
        if (clean) values.add(clean);
      });
    } else {
      const clean = String(v || '').trim();
      if (clean) values.add(clean);
    }
  });

  return [...values].sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));
}

function fillSelectOptions(selectEl, values, multiple = false) {
  if (!selectEl) return;

  selectEl.innerHTML = '';

  if (!multiple) {
    const opt = document.createElement('option');
    opt.value = '';
    opt.textContent = '—';
    selectEl.appendChild(opt);
  }

  values.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v;
    selectEl.appendChild(opt);
  });
}

function setSelectedValues(selectEl, values) {
  const arr = Array.isArray(values) ? values.map(v => String(v)) : [String(values || '')];

  [...selectEl.options].forEach(opt => {
    opt.selected = arr.includes(opt.value);
  });
}

function getSelectedValues(selectEl) {
  return [...selectEl.selectedOptions].map(opt => opt.value).filter(Boolean);
}

function prepareSongMetaFormSelections(data = {}) {
  const defaultCategories = ['Répertoire', 'En travail', '1 minute', 'Archives'];
  const categories = [...new Set([...defaultCategories, ...getMetaValues('category')])];
  const styles = getMetaValues('style');
  const ambiances = getMetaValues('ambiance');
  const audiences = getMetaValues('audience');
  const chanteurs = getMetaValues('chanteur');

  fillSelectOptions(songMetaCategory, categories, false);
  fillSelectOptions(songMetaStyle, styles, true);
  fillSelectOptions(songMetaAmbiance, ambiances, false);
  fillSelectOptions(songMetaAudience, audiences, true);
  fillSelectOptions(songMetaChanteur, chanteurs, true);

  songMetaCategory.value = data?.category || 'Répertoire';
  songMetaAmbiance.value = data?.ambiance || '';

  setSelectedValues(songMetaStyle, Array.isArray(data?.style) ? data.style : []);
  setSelectedValues(songMetaAudience, Array.isArray(data?.audience) ? data.audience : []);
  setSelectedValues(songMetaChanteur, Array.isArray(data?.chanteur) ? data.chanteur : []);
}

async function saveSongMetaModal() {
  const pin = prompt("PIN requis") || "";
  const cleanPin = String(pin).trim();
  if (!cleanPin) return;

  try {
    let res;

    if (songMetaMode === 'create') {
      const title = String(songMetaTitleInput.value || "").trim();
      const artist = String(songMetaArtistInput.value || "").trim();

      if (!title) {
        alert("Titre du morceau requis");
        return;
      }

      if (!artist) {
        alert("Artiste requis");
        return;
      }

      const fileName = `${title} - ${artist}.pro`;

      const payload = {
        fileName,
        pin: cleanPin,
        title,
        artist,
        category: songMetaCategory.value,
        style: getSelectedValues(songMetaStyle),
        ambiance: songMetaAmbiance.value,
        audience: getSelectedValues(songMetaAudience),
        chanteur: getSelectedValues(songMetaChanteur)
      };

      res = await fetch('/create-song', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    } else {
      const fileName = String(songMetaFileName.value || "").trim();
      if (!fileName) {
        alert("Nom de fichier requis");
        return;
      }

      const payload = {
        fileName,
        pin: cleanPin,
        title: songMetaTitleInput.value,
        artist: songMetaArtistInput.value,
        category: songMetaCategory.value,
        style: getSelectedValues(songMetaStyle),
        ambiance: songMetaAmbiance.value,
        audience: getSelectedValues(songMetaAudience),
        chanteur: getSelectedValues(songMetaChanteur)
      };

      res = await fetch('/save-song-meta', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    }

    if (res.ok) {
      closeSongMetaModal();
      await fetchSongMeta();
      await fetchSongs();
      filterSongList(songSearchInput?.value || "");

      if (songMetaMode === 'create') {
        showToast("Morceau créé ✅");
      } else {
        showToast("Infos morceau enregistrées ✅");
      }
    } else if (res.status === 403) {
      alert("PIN invalide");
    } else if (res.status === 409) {
      alert("Le morceau existe déjà");
    } else {
      const txt = await res.text();
      alert("Erreur d'enregistrement : " + txt);
    }
  } catch (err) {
    console.error(err);
    alert("Erreur d'enregistrement");
  }
}

function populateSongFilters() {
  if (!categoryFilterEl || !styleFilterEl || !ambianceFilterEl || !audienceFilterEl || !singerFilterEl) return;

  const categoriesMap = new Map();
  const stylesMap = new Map();
  const ambiancesMap = new Map();
  const audiencesMap = new Map();
  const chanteursMap = new Map();

  function addToMap(map, rawValue) {
    const cleanDisplay = String(rawValue || '').trim();
    const cleanKey = normalizeText(rawValue);
    if (cleanDisplay && cleanKey && !map.has(cleanKey)) {
      map.set(cleanKey, cleanDisplay);
    }
  }

  allSongs.forEach(song => {
    const meta = getMetaForSong(song);

    addToMap(categoriesMap, meta.category);
    addToMap(ambiancesMap, meta.ambiance);

    (Array.isArray(meta.style) ? meta.style : []).forEach(v => addToMap(stylesMap, v));
    (Array.isArray(meta.audience) ? meta.audience : []).forEach(v => addToMap(audiencesMap, v));
    (Array.isArray(meta.chanteur) ? meta.chanteur : []).forEach(v => addToMap(chanteursMap, v));
  });

  const currentCategory = categoryFilterEl.value || 'Répertoire';
  const currentStyle = styleFilterEl.value;
  const currentAmbiance = ambianceFilterEl.value;
  const currentAudience = audienceFilterEl.value;
  const currentSinger = singerFilterEl.value;

  const defaultCategories = ['Répertoire', 'En travail', '1 minute', 'Archives'];
  const sortedCategories = [...new Set([
    ...defaultCategories,
    ...[...categoriesMap.values()].sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }))
  ])];
  const sortedStyles = [...stylesMap.values()].sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));
  const sortedAmbiances = [...ambiancesMap.values()].sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));
  const sortedAudiences = [...audiencesMap.values()].sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));
  const sortedChanteurs = [...chanteursMap.values()].sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));

  categoryFilterEl.innerHTML =
    sortedCategories.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');

  styleFilterEl.innerHTML =
    `<option value="">Tous les styles</option>` +
    sortedStyles.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');

  ambianceFilterEl.innerHTML =
    `<option value="">Toutes les ambiances</option>` +
    sortedAmbiances.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');

  audienceFilterEl.innerHTML =
    `<option value="">Toutes les audiences</option>` +
    sortedAudiences.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');

  singerFilterEl.innerHTML =
    `<option value="">Tous les chanteurs</option>` +

  styleFilterEl.value = [...styleFilterEl.options].some(opt => opt.value === currentStyle) ? currentStyle : "";
  ambianceFilterEl.value = [...ambianceFilterEl.options].some(opt => opt.value === currentAmbiance) ? currentAmbiance : "";
  audienceFilterEl.value = [...audienceFilterEl.options].some(opt => opt.value === currentAudience) ? currentAudience : "";
  singerFilterEl.value = [...singerFilterEl.options].some(opt => opt.value === currentSinger) ? currentSinger : "";
  updateCategoryTitle();

function getSongDisplayInfo(song) {
  const meta = getMetaForSong(song);
  const fileBase = String(song || '').replace(/\.(pro|cho)$/i, '');
  const parts = fileBase.split(' - ');
  const fallbackTitle = parts[0] || fileBase;
  const fallbackArtist = parts.length > 1 ? parts.slice(1).join(' - ') : '';

  return {
    title: String(meta.title || fallbackTitle).trim(),
    artist: String(meta.artist || fallbackArtist).trim(),
    fileBase
  };
}

function sortSongsForLibrary() {
  allSongs.sort((a, b) => {
    const infoA = getSongDisplayInfo(a);
    const infoB = getSongDisplayInfo(b);
    const labelA = `${infoA.title} ${infoA.artist}`.trim() || infoA.fileBase;
    const labelB = `${infoB.title} ${infoB.artist}`.trim() || infoB.fileBase;

    return labelA.localeCompare(labelB, 'fr', {
      sensitivity: 'base',
      numeric: true
    }) || String(a).localeCompare(String(b), 'fr', {
      sensitivity: 'base',
      numeric: true
    });
  });

  if (currentFileName) {
    currentIndex = allSongs.indexOf(currentFileName);
  }
}

async function fetchSongBundle(fileName) {
  if (!fileName) {
    throw new Error('Nom de morceau manquant');
  }

  const res = await fetch('/song-bundle?fileName=' + encodeURIComponent(fileName), {
    cache: 'no-store'
  });

  if (!res.ok) {
    throw new Error('Chargement bundle impossible');
  }

  const bundle = await res.json();
  const content = String(bundle?.content || '');
  const settings = {
    fontSize: Number.isFinite(Number(bundle?.settings?.fontSize)) ? Number(bundle.settings.fontSize) : 26,
    speed: Number.isFinite(Number(bundle?.settings?.speed)) ? Number(bundle.settings.speed) : 50,
    transpose: Number.isFinite(Number(bundle?.settings?.transpose)) ? Number(bundle.settings.transpose) : 0
  };

  songTextCache.set(fileName, content);
  songSettingsCache.set(fileName, settings);

  return { content, settings };
}

function prefetchSongBundle(fileName) {
  if (!fileName) return;
  if (songTextCache.has(fileName) && songSettingsCache.has(fileName)) return;
  if (songBundlePrefetches.has(fileName)) return;

  const promise = fetchSongBundle(fileName)
    .catch(err => {
      console.warn('Préchargement ignoré pour', fileName, err);
    })
    .finally(() => {
      songBundlePrefetches.delete(fileName);
    });

  songBundlePrefetches.set(fileName, promise);
}

function getPrefetchSongIndexes(centerIndex) {
  const filteredIndexes = getFilteredSongIndexes();
  const pos = filteredIndexes.indexOf(centerIndex);

  if (pos !== -1) {
    return [
      filteredIndexes[pos + 1],
      filteredIndexes[pos - 1]
    ].filter(idx => Number.isInteger(idx) && idx >= 0 && idx < allSongs.length);
  }

  return [
    centerIndex + 1,
    centerIndex - 1
  ].filter(idx => Number.isInteger(idx) && idx >= 0 && idx < allSongs.length);
}

function scheduleSongPrefetch(centerIndex) {
  const targets = getPrefetchSongIndexes(centerIndex)
    .map(idx => allSongs[idx])
    .filter(Boolean);

  if (!targets.length) return;

  const runPrefetch = () => {
    targets.forEach(prefetchSongBundle);
  };

  if (typeof requestIdleCallback === 'function') {
    requestIdleCallback(runPrefetch, { timeout: 1200 });
    return;
  }

  setTimeout(runPrefetch, 150);
}

      } else {

      console.log('Temps texte:', textElapsed, 'ms');
      console.log('Temps settings:', Math.round(performance.now() - tSettingsStart), 'ms');

    if (loadToken !== currentLoadToken) return;

function normalizeText(value) {
  return String(value || '')
    .normalize('NFKD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[’`´]/g, "'")
    .replace(/\s+/g, ' ')
    .trim()
    .toLowerCase();
}

function normName(value) {
  return normalizeText(value);
}

function normalizeMetaArray(value) {
  if (Array.isArray(value)) {
    return [...new Set(
      value
        .map(v => normalizeText(v))
        .filter(Boolean)
    )];
  }

  if (value == null || value === '') return [];
  return [normalizeText(value)];
}

function getMetaForSong(song) {
  return songMetaIndex[normName(song)] || {};
}

function debugMetaMatching() {

  })));

  const unusedMeta = Object.keys(songMeta).filter(key => {
    return !allSongs.some(song => normName(song) === normName(key));
  });

  console.log("UNUSED META KEYS:", unusedMeta.length);
  console.table(unusedMeta.map(key => ({
    metaKey: key,
    normalized: normName(key)
  })));
}

function songMatchesFilters(song, query) {
  const meta = getMetaForSong(song);

  const selectedCategory = normalizeText(categoryFilterEl?.value || "Répertoire");
  const selectedStyle = normalizeText(styleFilterEl?.value || "");
  const selectedAmbiance = normalizeText(ambianceFilterEl?.value || "");
  const selectedAudience = normalizeText(audienceFilterEl?.value || "");
  const selectedSinger = normalizeText(singerFilterEl?.value || "");
  const selectedPlayed = normalizeText(playedFilterEl?.value || "");
  const normalizedQuery = normalizeText(query || "");

  const searchableText = normalizeText([
    song,
    meta.title || '',
    meta.artist || '',
    meta.category || '',
    meta.ambiance || '',
    ...(Array.isArray(meta.style) ? meta.style : []),
    ...(Array.isArray(meta.audience) ? meta.audience : []),
    ...(Array.isArray(meta.chanteur) ? meta.chanteur : [])
  ].join(' '));

  const category = normalizeText(meta.category || 'Répertoire');
  const ambiance = normalizeText(meta.ambiance || '');
  const styleValues = normalizeMetaArray(meta.style);
  const audienceValues = normalizeMetaArray(meta.audience);
  const singerValues = normalizeMetaArray(meta.chanteur);

  const played = isPlayedTonight(song) ? "played" : "unplayed";

  return (
    (!normalizedQuery || searchableText.includes(normalizedQuery)) &&
    category === selectedCategory &&
    (!selectedStyle || styleValues.includes(selectedStyle)) &&
    (!selectedAmbiance || ambiance === selectedAmbiance) &&
    (!selectedAudience || audienceValues.includes(selectedAudience)) &&
    (!selectedSinger || singerValues.includes(selectedSinger)) &&
    (!selectedPlayed || played === selectedPlayed)
  );
}

  function clamp01(x){ return Math.max(0, Math.min(1, x)); }

  function getTopLyricAnchorState() {
    const blocks = viewerElement.querySelectorAll('[data-kind="lyric"][data-anchor]');
    if (!blocks.length) return null;

    const st = viewerElement.scrollTop;
    const max = Math.max(0, getViewerMaxSongScrollTop());
    const scrollRatio = max > 0 ? clamp01(st / max) : 0;
    const baseState = { top: st, scrollRatio };
    const first = blocks[0];
    if (st < first.offsetTop - 8) {
      return { ...baseState, anchor: '', progress: 0 };
    }

    for (const el of blocks) {
      const top = el.offsetTop;
      const h = el.offsetHeight || 1;
      if (top + h > st + 8) {
        const progress = clamp01((st - top) / h);
        return { ...baseState, anchor: el.dataset.anchor, progress };
      }
    }

    const last = blocks[blocks.length - 1];
    return { ...baseState, anchor: last.dataset.anchor, progress: 1 };
  }

  let lastEmitAt = 0;
  let lastEmitAnchor = "";
  let lastEmitProg = -1;

function emitLeaderScrollSync(force = false) {
  if (!canDrivePlayback() || isRemoteScrolling) return;

  const state = getTopLyricAnchorState();
  if (!state) return;

  const now = Date.now();
  const emitAnchor = state.top != null ? '__top__' : state.anchor;
  const emitProgress = state.top != null ? state.top : state.progress;

  if (!force &&
    now - lastEmitAt < 40 &&
    emitAnchor === lastEmitAnchor &&
    Math.abs(emitProgress - lastEmitProg) < 0.02
  ) {
    return;
  }

  lastEmitAt = now;
  lastEmitAnchor = emitAnchor;
  lastEmitProg = emitProgress;

  socket.emit('scroll-sync', state);
}

socket.on('apply-scroll', data => {
  if (Date.now() < ignoreRemoteScrollUntil) return;
  if (Date.now() < forceTopUntil) return;
  if (isLoadingSong) return;

  const anchor = data?.anchor;
  const progress = clamp01(Number(data?.progress) || 0);
  const top = Number(data?.top);
  const scrollRatio = Number(data?.scrollRatio);

  const el = anchor
    ? viewerElement.querySelector(`[data-kind="lyric"][data-anchor="${CSS.escape(anchor)}"]`)
    : null;

  let targetTop;
  const maxSongScrollTop = getViewerMaxSongScrollTop();
  if (Number.isFinite(scrollRatio) && maxSongScrollTop > 0) {
    targetTop = clamp01(scrollRatio) * maxSongScrollTop;
  } else if (Number.isFinite(top)) {
    targetTop = Math.max(0, top);
  } else if (el) {
    const top = el.offsetTop;
    const h = el.offsetHeight || 1;
    targetTop = top + progress * h;
  } else {
    const max = viewerElement.scrollHeight - viewerElement.clientHeight;
    targetTop = progress * (max > 0 ? max : 0);
  }

  if (
    isScrolling &&
    playbackActive &&
    targetTop < 12 &&
    viewerElement.scrollTop > 120 &&
    anchor
  ) {
    return;
  }

  if (Math.abs(viewerElement.scrollTop - targetTop) < 8) return;

  pendingRemoteScrollTop = targetTop;

  if (remoteScrollRaf) cancelAnimationFrame(remoteScrollRaf);
  remoteScrollRaf = requestAnimationFrame(() => {
    isRemoteScrolling = true;
    viewerElement.scrollTop = pendingRemoteScrollTop;
    setTimeout(() => { isRemoteScrolling = false; }, 50);
  });
});

  function sliderToPxPerSecond(value) {
    const v = Number(value) || 50;
    const delayMs = Math.max(10, 105 - v);
    return 1000 / delayMs;
  }

  function getViewerMaxSongScrollTop() {
    const contentBottom = songContentEl.offsetTop + songContentEl.offsetHeight;
    return Math.max(0, contentBottom - viewerElement.clientHeight);
  }

  function autoScrollLoop(t) {
    if (!isScrolling) return;

    if (!lastRafTime) lastRafTime = t;
    const dt = t - lastRafTime;
    lastRafTime = t;

    const pxPerSec = sliderToPxPerSecond(speedInput.value);
    const deltaPx = (dt / 1000) * pxPerSec;

    scrollCarry += deltaPx;
    const step = Math.floor(scrollCarry);
    const maxScrollTop = getViewerMaxSongScrollTop();

    if (viewerElement.scrollTop >= maxScrollTop - 1) {
      viewerElement.scrollTop = maxScrollTop;
      stopAutoScroll();

      if (isLeader) {
        const state = getTopLyricAnchorState();
        if (state) socket.emit('scroll-sync', state);
        socket.emit('sync-autoscroll', {
          active: false,
          speed: Number(speedInput.value) || 50
        });
      }
      return;
    }

    if (step >= 1) {
      const prevScrollTop = viewerElement.scrollTop;
      const nextScrollTop = Math.min(maxScrollTop, prevScrollTop + step);
      viewerElement.scrollTop = nextScrollTop;
      scrollCarry -= (nextScrollTop - prevScrollTop);

      if (nextScrollTop >= maxScrollTop) {
        stopAutoScroll();

        if (isLeader) {
          const state = getTopLyricAnchorState();
          if (state) socket.emit('scroll-sync', state);
          socket.emit('sync-autoscroll', {
            active: false,
            speed: Number(speedInput.value) || 50
          });
        }
        return;
      }
    }

    rafId = requestAnimationFrame(autoScrollLoop);
  }

  function toggleChordStyle() {

  const scaleSharp = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const scaleFixed = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
  const scaleLatFixed = ['Do','Do#','Ré','Mib','Mi','Fa','Fa#','Sol','Lab','La','Sib','Si'];

  function normalizeNote(note) {
    return note
      .replace('Cb','B')
      .replace('Bb','A#')
      .replace('Db','C#')
      .replace('Eb','D#')
      .replace('Gb','F#')
      .replace('Ab','G#')
      .replace('Fb','E')
      .replace('E#','F')
      .replace('B#','C');
  }

  function transChord(chord, steps) {
    return chord.replace(/([A-G][#b]?)/g, (match) => {
      const n = normalizeNote(match);
      const idx = scaleSharp.indexOf(n);
      if (idx === -1) return match;
      let newIdx = (idx + steps) % 12;
      if (newIdx < 0) newIdx += 12;
      const targetScale = chordStyle === 'latin' ? scaleLatFixed : scaleFixed;
      return targetScale[newIdx];
    });
  }

  function parseChordProLine(line) {
    const segments = [];
    let pendingChord = '';
    let text = '';
    let lyricLine = '';
    let i = 0;

    while (i < line.length) {
      const ch = line[i];

      if (ch === '[') {
        const end = line.indexOf(']', i);
        if (end !== -1) {
          const match = text.match(/(\S+)$/);
          const wordPrefix = match ? match[1] : '';

          if (wordPrefix) {
            text = text.slice(0, -wordPrefix.length);
          }

          if (text || pendingChord) {
            segments.push({ chord: pendingChord, text });
          }

          pendingChord = transChord(line.slice(i + 1, end), transposeValue);
          text = wordPrefix;
          i = end + 1;
          continue;
        }
      }

      text += ch;
      lyricLine += ch;
      i++;
    }

    if (text || pendingChord || !segments.length) {
      segments.push({ chord: pendingChord, text });
    }

    return { segments, lyricLine };
  }

  function clearSongContent() {

  function parseZoomIpadDirective(line){
    const m = String(line || "").trim().match(/^\{zoom-ipad\s*:\s*([0-9]*\.?[0-9]+)\s*\}$/i);
    if (!m) return null;
    const v = Number(m[1]);
    if (!isFinite(v) || v <= 0) return null;
    return v;
  }

  function addCenteredTitle(text, level) {

  function addCommentLine(text, targetEl, type = 'comment') {
    const wrap = document.createElement('div');

    span.className = type === 'detail' ? 'commentline detail' : 'commentline';

    wrap.appendChild(span);
    targetEl.appendChild(wrap);
  }

  function expandSegmentsForWordWrapping(segments) {
    const expanded = [];
    let carrySpaces = '';

    for (const segment of segments) {
      const chordText = String(segment.chord || '');
      const incomingSpaces = carrySpaces;
      const segmentText = String(segment.text || '');
      const rawText = incomingSpaces + segmentText;
      const trailingSpaces = rawText.match(/\s+$/)?.[0] || '';
      const text = trailingSpaces ? rawText.slice(0, -trailingSpaces.length) : rawText;
      carrySpaces = trailingSpaces;

      if (!text) {
        if (chordText) {
          const leadingSpaces = incomingSpaces.length;
          expanded.push({ chord: chordText, text: '\u00a0', leadingSpaces });
          carrySpaces = segmentText.trim() ? '' : segmentText;
        }
        continue;
      }

      const chunks = text.match(/\s*\S+/g) || [text];
      let chordUsed = false;

      for (const chunk of chunks) {
        const isWhitespaceOnly = !/\S/.test(chunk);
        const chord = (!chordUsed && !isWhitespaceOnly) ? chordText : '';
        if (chord) chordUsed = true;

        const leadingSpaces = (chunk.match(/^\s+/)?.[0] || '').length;
        const cleanText = chunk.replace(/^\s+/, '');

        if (!cleanText) continue;
        expanded.push({ chord, text: cleanText, leadingSpaces });
      }

      if (chordText && !chordUsed) {
        expanded.push({ chord: chordText, text: '\u00a0' });
      }
    }

    return expanded;
  }

  function addChordBlock(segments, lyricLine, targetEl, anchorId) {
    const block = document.createElement('div');
    block.className = 'block';
    block.style.fontSize = (fontSize * currentSongZoom) + 'px';
    block.dataset.kind = 'lyric';
    if (anchorId) block.dataset.anchor = anchorId;

    const hasChords = segments.some(segment => String(segment.chord || '').trim());
    const row = document.createElement('span');
    row.className = hasChords ? 'chord-row' : 'chord-row no-chords';
    const renderSegments = hasChords ? segments : [{ chord: '', text: lyricLine }];

    for (const segment of expandSegmentsForWordWrapping(renderSegments)) {
      const cell = document.createElement('span');
      cell.className = 'chord-cell';
      cell.style.marginLeft = ((Number(segment.leadingSpaces) || 0) * 0.62) + 'em';

      const chord = document.createElement('span');
      chord.className = 'chord';
      chord.textContent = segment.chord || '\u00a0';

      const lyric = document.createElement('span');
      lyric.className = 'lyric';
      lyric.textContent = segment.text || '\u00a0';

      cell.appendChild(chord);
      cell.appendChild(lyric);
      row.appendChild(cell);
    }

    block.appendChild(row);
    targetEl.appendChild(block);
  }

  function normAnchorText(s){
    return String(s || "").toLowerCase().replace(/\s+/g, ' ').trim();
  }

  function hashDJB2(str){
    let h = 5381;
    for (let i=0; i<str.length; i++) h = ((h << 5) + h) + str.charCodeAt(i);
    return (h >>> 0).toString(16);
  }

  function parsePUStart(line){
    const m = line.match(/^\{pu\s*:\s*([^}]+)\}$/i);
    if (!m) return null;
    return { user: m[1].trim() };
  }

function renderPUBlock(targetEl, showContent, label, text){
  const wrap = document.createElement('div');
  wrap.className = 'pu-block';

  const userColor = getUserColor(label);
  wrap.style.background = hexToRgba(userColor, 0.18);
  wrap.style.borderLeft = `4px solid ${userColor}`;
  wrap.style.color = 'var(--text)';

  const linesCount = (String(text || "").split('\n').length);

  if (showContent) {

    lab.className = 'pu-label';
    lab.textContent = `SOLO ${label}`;
    lab.style.color = userColor;
    wrap.appendChild(lab);
  }

  if (showContent) {
    renderPUContent(wrap, text || "");
  } else {
    const pre = document.createElement('pre');
    pre.className = 'pu-pre';
    pre.textContent = Array.from({ length: linesCount }, () => " ").join("\n");
    wrap.appendChild(pre);
  }

  targetEl.appendChild(wrap);
}

function renderPUContent(targetEl, text) {
  const lines = String(text || "").split('\n');
  let textBuffer = [];
  let tabBuffer = [];
  let inPersonalTab = false;

  const flushText = () => {
    if (!textBuffer.length) return;

    const pre = document.createElement('pre');
    pre.className = 'pu-pre';
    pre.textContent = textBuffer.join('\n');
    targetEl.appendChild(pre);
    textBuffer = [];
  };

  for (const lineRaw of lines) {
    const line = String(lineRaw || "");

    if (inPersonalTab) {
      if (/^\{\/tab\s*\}$/i.test(line.trim())) {
        flushText();
        renderTabBlock(targetEl, tabBuffer.join("\n"));
        inPersonalTab = false;
        tabBuffer = [];
        continue;
      }

      tabBuffer.push(line);
      continue;
    }

    if (/^\{tab\s*\}$/i.test(line.trim())) {
      flushText();
      inPersonalTab = true;
      tabBuffer = [];
      continue;
    }

    textBuffer.push(line);
  }

  if (inPersonalTab) {
    flushText();
    renderTabBlock(targetEl, tabBuffer.join("\n"));
  }

  flushText();
}

function renderTabBlock(targetEl, text) {
  const wrap = document.createElement('div');
  wrap.className = 'tab-block';
  wrap.style.fontSize = (fontSize * currentSongZoom) + 'px';

  const pre = document.createElement('pre');
  pre.className = 'tab-pre';
  pre.textContent = text || "";

  const lines = String(text || "").split('\n');
  const longestLineLength = Math.max(1, ...lines.map(line => line.length));
  const availableWidth = Math.max(220, viewerElement.clientWidth - 92);
  const maxFontSize = Math.max(18, Math.min(42, fontSize * currentSongZoom * 1.05));
  const estimatedCharWidth = 0.64;
  const fitFontSize = availableWidth / (longestLineLength * estimatedCharWidth);
  const finalFontSize = Math.max(7, Math.min(maxFontSize, fitFontSize));

  pre.style.setProperty('--tab-font-size', finalFontSize.toFixed(2) + 'px');

  wrap.appendChild(pre);
  targetEl.appendChild(wrap);
}

  function renderGrids() {
    // Legacy refresh hook kept for font-size/transpose controls.
  }

  function startSectionBlock(className) {
    const container = document.createElement('div');
    container.className = className;
    songContentEl.appendChild(container);
    return container;
  }

  function renderChordPro() {
    clearSongContent();
    renderChordPro._occ = {};

    const lines = currentRaw.split('\n');

    let zoomSong = 1;
    for (const line of lines) {
      const z = parseZoomIpadDirective(line);
      if (z !== null) { zoomSong = z; break; }
    }

    currentSongZoom = zoomSong;
    songContentEl.style.setProperty('--song-zoom', String(currentSongZoom));

    const overlayLayer = document.createElement('div');
    overlayLayer.id = 'overlayLayer';
    songContentEl.appendChild(overlayLayer);

    let sectionType = '';
    let sectionContainer = null;
    let inPU = false;
    let puUser = "";
    let puBuffer = [];
    let inTab = false;
    let tabBuffer = [];

    for (const lineRaw of lines) {
      const line = String(lineRaw || "");
      if (parseZoomIpadDirective(line) !== null) continue;

      const target = sectionContainer || songContentEl;

      if (!inPU) {
        const start = parsePUStart(line.trim());
        if (start) {
          inPU = true;
          puUser = start.user;
          puBuffer = [];
          continue;
        }
      } else {
        if (/^\{\/pu\s*\}$/i.test(line.trim())) {
          const show = (currentUser || "").toLowerCase() === puUser.toLowerCase();
          const txt = puBuffer.join("\n");
          renderPUBlock(target, show, puUser, txt);
          inPU = false;
          puUser = "";
          puBuffer = [];
          continue;
        }

        puBuffer.push(line);
        continue;
      }

      if (inTab) {
        if (/^\{\/tab\s*\}$/i.test(line.trim())) {
          renderTabBlock(target, tabBuffer.join("\n"));
          inTab = false;
          tabBuffer = [];
          continue;
        }

        tabBuffer.push(line);
        continue;
      }

      if (/^\{tab\s*\}$/i.test(line.trim())) {
        inTab = true;
        tabBuffer = [];
        continue;
      }

      const title = line.match(/\{(?:t|title)\s*:\s*(.*?)\}/i);
      if (title) { addCenteredTitle(title[1], 1); continue; }

      const subtitle = line.match(/\{(?:st|subtitle)\s*:\s*(.*?)\}/i);
      if (subtitle) { addCenteredTitle(subtitle[1], 2); continue; }

      if (/\{soc\s*:\s*\}/i.test(line) || /\{soc\s*\}/i.test(line)) {
        sectionType = 'chorus';
        sectionContainer = startSectionBlock('chorus-block');
        continue;
      }

      if (/\{eoc\s*:\s*\}/i.test(line) || /\{eoc\s*\}/i.test(line)) {
        if (sectionType === 'chorus') {
          sectionType = '';
          sectionContainer = null;
        }
        continue;
      }

      if (/\{sov\s*:\s*\}/i.test(line) || /\{sov\s*\}/i.test(line)) {
        sectionType = 'verse';
        sectionContainer = startSectionBlock('verse-block');
        continue;
      }

      if (/\{eov\s*:\s*\}/i.test(line) || /\{eov\s*\}/i.test(line)) {
        if (sectionType === 'verse') {
          sectionType = '';
          sectionContainer = null;
        }
        continue;
      }

      if (/\{sob\s*:\s*\}/i.test(line) || /\{sob\s*\}/i.test(line)) {
        sectionType = 'bridge';
        sectionContainer = startSectionBlock('bridge-block');
        continue;
      }

      if (/\{eob\s*:\s*\}/i.test(line) || /\{eob\s*\}/i.test(line)) {
        if (sectionType === 'bridge') {
          sectionType = '';
          sectionContainer = null;
        }
        continue;
      }

      const detail = line.match(/^\{d\s*:\s*(.*?)\}(.*)$/i);
      if (detail) {
        addCommentLine(detail[1], target, 'detail');

        const trailingLine = String(detail[2] || '');
        if (!trailingLine.trim()) {
          continue;
        }

        const { segments, lyricLine } = parseChordProLine(trailingLine);
        const key = normAnchorText(lyricLine);
        renderChordPro._occ[key] = (renderChordPro._occ[key] || 0) + 1;
        const anchorId = hashDJB2(key) + "-" + renderChordPro._occ[key];
        addChordBlock(segments, lyricLine, target, anchorId);
        continue;
      }

      const comment = line.match(/^\{c\s*:\s*(.*?)\}(.*)$/i);
      if (comment) {
        addCommentLine(comment[1], target);

        const trailingLine = String(comment[2] || '');
        if (!trailingLine.trim()) {
          continue;
        }

        const { segments, lyricLine } = parseChordProLine(trailingLine);
        const key = normAnchorText(lyricLine);
        renderChordPro._occ[key] = (renderChordPro._occ[key] || 0) + 1;
        const anchorId = hashDJB2(key) + "-" + renderChordPro._occ[key];
        addChordBlock(segments, lyricLine, target, anchorId);
        continue;
      }

      const { segments, lyricLine } = parseChordProLine(line);
      const key = normAnchorText(lyricLine);
      renderChordPro._occ[key] = (renderChordPro._occ[key] || 0) + 1;
      const anchorId = hashDJB2(key) + "-" + renderChordPro._occ[key];
      addChordBlock(segments, lyricLine, target, anchorId);
    }

    if (inTab) {
      const target = sectionContainer || songContentEl;
      renderTabBlock(target, tabBuffer.join("\n"));
    }

    const endSpacer = document.createElement('div');
    endSpacer.className = 'song-end-spacer';
    songContentEl.appendChild(endSpacer);
  }

    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      fileName: currentFileName,
      content: newContent,

currentRaw = newContent;

  }

  const BACKUP_PREFIXES = ['bandapp_', 'notes:', 'overlay:', 'grids:'];

  function isBackupKey(k) {

  function exportBackup() {
    try {
      const data = {};
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (!key) continue;
        if (!isBackupKey(key)) continue;
        data[key] = localStorage.getItem(key);
      }

      const payload = {
        app: "bandapp",
        schemaVersion: 1,
        exportedAt: new Date().toISOString(),
        data
      };

      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);

      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const filename = `bandapp-backup-${y}-${m}-${day}.json`;

      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();

      URL.revokeObjectURL(url);
      showToast("Sauvegarde exportée ✅");
    } catch (e) {
      console.error(e);
      alert("Erreur export sauvegarde");
    }
  }

  function triggerImport() {
    closeSettings();
    const input = document.getElementById('importFile');
    if (!input) return;
    input.value = "";
    setTimeout(() => input.click(), 80);
  }

  function handleImportFile(event) {
    const file = event?.target?.files?.[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
      try {
        const txt = String(reader.result || "");
        const json = JSON.parse(txt);

        if (!json || json.app !== "bandapp" || typeof json.data !== "object") {
          alert("Fichier de sauvegarde invalide.");
          return;
        }

        const keys = Object.keys(json.data);
        for (const k of keys) {
          localStorage.setItem(k, json.data[k]);
        }

        showToast("Sauvegarde importée ✅");
        setTimeout(() => location.reload(), 600);
      } catch (e) {
        console.error(e);
        alert("Erreur : impossible d'importer la sauvegarde.");
      }
    };
    reader.readAsText(file);
  }

function insertAtCursor(text){
  const ta = document.getElementById('editor-textarea');
  if (!ta) return;

  const start = ta.selectionStart || 0;
  const end = ta.selectionEnd || 0;

  ta.value = ta.value.substring(0, start) + text + ta.value.substring(end);
  ta.selectionStart = ta.selectionEnd = start + text.length;
  ta.focus();

  renderChordBankFromEditor();
}

  function insertTemplatePU(){
    const u = currentUser || "Nom";
    insertAtCursor(`{pu:${u}}\n\n{/pu}\n`);
  }

  function insertTemplateComment(){
    insertAtCursor(`{c: }\n`);
  }

  function insertTemplateDetail(){
    insertAtCursor(`{d: }\n`);
  }

  function insertTemplateSection(startTag, endTag){
    insertAtCursor(`{${startTag}}\n\n{${endTag}}\n`);
  }

  function insertTemplateTab(){
    insertAtCursor(`{tab}\n\n{/tab}\n`);
  }

  function extractChordsFromText(text){
    const set = new Set();
    const re = /\[([^\]]+)\]/g;
    let m;
    while ((m = re.exec(text)) !== null){
      set.add(m[1].trim());
    }
    return Array.from(set);
  }

  function renderChordBankFromEditor(){
    const bank = document.getElementById('chordBank');
    if (!bank) return;

    const chords = extractChordsFromText(editorTextarea.value);

    if (!chords.length){
      bank.innerHTML = "";
      return;
    }

    bank.innerHTML =
      "<span style='opacity:.5;font-size:12px;'>Accords:</span>" +
      chords.map(c =>
        `<button class="btn" style="padding:6px 10px;font-size:12px;" onclick="insertAtCursor('[${escapeHtml(c)}]')">${escapeHtml(c)}</button>`
      ).join('');
  }

async function openHistoryModal() {
  if (!currentFileName) return;

  historyBackdrop.style.display = 'flex';
  historyList.innerHTML = "Chargement...";

  try {
    const res = await fetch('/song-history?fileName=' + encodeURIComponent(currentFileName));
    const items = await res.json();

    if (!Array.isArray(items) || !items.length) {
      historyList.innerHTML = "<div>Aucune version enregistrée.</div>";
      return;
    }

historyList.innerHTML = items.map((item, idx) => {
  const label = idx === 0 ? "Restaurer la dernière version" : "Restaurer cette version";
  return `
    <div style="
      border:1px solid rgba(255,255,255,0.12);
      border-radius:12px;
      padding:12px;
      margin-bottom:10px;
      background:rgba(255,255,255,0.04);
    ">
      <div style="
        font-weight:900;
        margin-bottom:6px;
        color:#eee;
      ">
        ${escapeHtml(item.savedAt || '')}
      </div>

      <div style="
        font-size:13px;
        margin-bottom:8px;
        color:#ddd;
      ">
        Par ${escapeHtml(item.savedBy || 'Inconnu')}
      </div>

      <button class="btn" onclick="restoreHistoryVersion('${item.id}')">${label}</button>
    </div>
  `;
}).join('');
  } catch (err) {
    console.error(err);
    historyList.innerHTML = "<div>Erreur de chargement de l'historique.</div>";
  }
}

function closeHistoryModal() {
  historyBackdrop.style.display = 'none';
}

async function restoreHistoryVersion(historyId) {
  if (!currentFileName) return;

  const ok = confirm("Restaurer cette version du morceau ?");
  if (!ok) return;

  const pin = prompt("PIN requis pour restaurer une ancienne version") || "";
  const cleanPin = String(pin).trim();
  if (!cleanPin) return;

  try {
    const res = await fetch('/restore-song', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        fileName: currentFileName,
        historyId,
        pin: cleanPin,
        userName: currentUser
      })
    });

    if (res.ok) {
      closeHistoryModal();
      stopAutoScroll();
	  
	  songTextCache.delete(currentFileName);
	songSettingsCache.delete(currentFileName);
	
      await loadSong(currentFileName);

      if (isLeader) socket.emit('change-song', currentFileName);

      showToast("Version restaurée ✅");
    } else if (res.status === 403) {
      alert("PIN invalide");
    } else {
      alert("Erreur lors de la restauration");
    }
  } catch (err) {
    console.error(err);
    alert("Erreur lors de la restauration");
  }
}

updateSpeedPercent();

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    ensureWakeLockSoon();
  } else {
    releaseWakeLock().catch(() => {});
  }
});

window.addEventListener('focus', ensureWakeLockSoon);
window.addEventListener('pageshow', ensureWakeLockSoon);
window.addEventListener('pagehide', () => {
  releaseWakeLock().catch(() => {});
});

['pointerdown', 'touchstart', 'keydown'].forEach(eventName => {
  window.addEventListener(eventName, () => {
    if (!wakeLockSupportChecked || !wakeLockSentinel) {
      ensureWakeLockSoon();
    }
  }, { passive: true });
});

function togglePlayedCurrentSong() {
  if (!currentFileName) return;

  const nextPlayed = !isPlayedTonight(currentFileName);
  socket.emit('mark-played', {
    fileName: currentFileName,
    played: nextPlayed
  });
}

function resetTonight() {
  const ok = confirm("Réinitialiser tous les morceaux joués ce soir ?");
  if (!ok) return;
  socket.emit('reset-played-tonight');
}

socket.on('played-tonight-state', (data) => {
  const arr = Array.isArray(data?.songs) ? data.songs : [];
  playedTonightSet = new Set(arr);

  renderSongList();
  filterSongList(songSearchInput?.value || "");
  updatePlayedButton();
});
